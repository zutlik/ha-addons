name: Vision Addon
version: "1.1.1"
slug: vision-addon
description: Camera-based gesture detection for Home Assistant (supports RTSP and local webcam)
url: "https://github.com/zutlik/ha-addons/tree/main/vision-addon"
arch:
  - aarch64
  - amd64
init: false
map:
  - share:rw
options:
  stream_url: "rtsp://10.100.102.15/live"
  detection_fps: 5
  face_confidence: 0.6
  gesture_confidence: 0.7
  gesture_cooldown_seconds: 2
  motion_cooldown_seconds: 5
schema:
  # RTSP URL (e.g. rtsp://user:pass@ip/live) or local device (/dev/video0)
  stream_url: "str"
  detection_fps: "int"
  face_confidence: "float"
  gesture_confidence: "float"
  gesture_cooldown_seconds: "int"
  motion_cooldown_seconds: "int"
restart_policy: unless-stopped
homeassistant_api: true
ingress: true
ingress_port: 8080
panel_icon: mdi:camera-account
panel_title: "Vision"
panel_admin: false
