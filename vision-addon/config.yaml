name: Vision Addon
version: "1.2.1"
slug: vision-addon
description: Camera-based gesture detection for Home Assistant (supports RTSP and local webcam)
url: "https://github.com/zutlik/ha-addons/tree/main/vision-addon"
arch:
  - aarch64
  - amd64
init: false
map:
  - share:rw
options:
  ha_token: ""
  camera_hostname: ""
  camera_user: ""
  camera_password: ""
  rtsp_path: "/h264Preview_01_sub"
  rtsp_port: 554
  stream_url: ""
  detection_fps: 10
  enable_face_detection: false
  face_confidence: 0.6
  face_detection_interval_seconds: 3.0
  gesture_confidence: 0.55
  gesture_tracking_confidence: 0.5
  gesture_model_complexity: 0
  gesture_cooldown_seconds: 1.2
  gesture_hold_seconds: 0.2
  gesture_miss_grace_seconds: 0.35
  gesture_min_frames: 2
  motion_cooldown_seconds: 5
  camera_width: 640
  camera_height: 480
  processing_width: 320
  jpeg_quality: 65
schema:
  # Long-Lived Access Token from HA → Profile → Security. Required for the
  # WebSocket DHCP discovery used to resolve camera_hostname → IP. Only
  # optional if you use stream_url (direct-URL mode) and don't need state
  # or event writes back to HA.
  ha_token: "password?"
  # DHCP hostname of the camera as seen on Settings → Devices → DHCP. The addon
  # subscribes to HA's DHCP discovery and resolves this to a current IP at
  # startup, then watches for changes.
  camera_hostname: "str?"
  camera_user: "str?"
  camera_password: "password?"
  rtsp_path: "str?"
  rtsp_port: "port?"
  # Optional. If set, skips DHCP discovery entirely and connects to this URL
  # directly. Use for static IPs, /dev/video* devices, or if HA's DHCP
  # integration isn't running. Format: rtsp://user:pass@host:port/path
  stream_url: "str?"
  detection_fps: "int"
  enable_face_detection: "bool"
  face_confidence: "float"
  face_detection_interval_seconds: "float"
  gesture_confidence: "float"
  gesture_tracking_confidence: "float"
  gesture_model_complexity: "int"
  gesture_cooldown_seconds: "float"
  gesture_hold_seconds: "float"
  gesture_miss_grace_seconds: "float"
  gesture_min_frames: "int"
  motion_cooldown_seconds: "int"
  camera_width: "int"
  camera_height: "int"
  processing_width: "int"
  jpeg_quality: "int"
ingress: true
ingress_port: 8080
panel_icon: mdi:camera-account
panel_title: "Vision"
panel_admin: false
